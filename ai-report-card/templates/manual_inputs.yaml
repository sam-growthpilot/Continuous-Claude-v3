# Weekly Manual Inputs
# Fill in before or after auto-run. If empty, AI-generated defaults are used.
# Re-run weekly_run.py after filling to regenerate with your inputs.
#
# Fields read by the generator:
#   executive_note        -> overrides narratives.executive_summary (deck + Word report)
#   this_week_highlights  -> overrides narratives.this_week_highlights (deck "This Week" slide)
#   outlook               -> overrides narratives.outlook (deck outlook)
#   roadmap_updates       -> roadmap slide / section
#   project_status_overrides -> per-project descriptions (Word report)
#   decisions_needed      -> decisions slide

week: "Week 27"
date: "2026-07-01"

# Strategic narrative override (replaces AI-generated executive summary)
executive_note: >-
  This week the AI Enablement platform crossed a meaningful threshold: it began improving
  and monitoring itself. We shipped a self-improvement capability that studies the platform's
  own components each day and proposes evidence-backed upgrades — two proposals delivered this
  week, the first already ratified onto the roadmap. In parallel we hardened operational
  reliability, repairing six recurring automated-job failures so the core now runs unattended
  and verifies its own health, and we stood up a reporting command center that tracks the health
  of every automated report and dashboard from one place. The through-line: the platform is
  maturing from something we build into something that increasingly maintains and extends
  itself — freeing the team to spend its time on higher-leverage work rather than upkeep.

# This Week's Highlights (deck "This Week" slide) — capability-led, outcome-first
this_week_highlights:
  - "Shipped a self-improvement capability — the platform now researches its own components daily and proposes evidence-backed upgrades. Two proposals delivered this week; the first (a memory-retrieval upgrade) is already ratified onto the roadmap."
  - "Hardened operational reliability — repaired six recurring automated-job failures. The daily quality-scoring and self-improvement jobs now run unattended and were verified passing on their own."
  - "Stood up a reporting command center — a single hub now tracks the health, reliability, and freshness of every automated report and dashboard, refreshed automatically each evening."
  - "Restored and future-proofed the weekly sponsor-briefing pipeline so leadership updates keep flowing without manual intervention."
  - "Multi-week resilience hardening so the core services run untended for weeks at a time."

# Forward-looking outlook
outlook: >-
  Next: wire the ratified memory-retrieval upgrade into the live path, stand up cloud-hosted
  managed agents for scheduled off-box work, and ship the enhanced sponsor briefing — while the
  Salesforce and PowerBI enterprise connectors continue toward launch.

# Decisions needing VP attention (none pressing this week)
decisions_needed: []

